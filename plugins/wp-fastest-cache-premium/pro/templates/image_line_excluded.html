<tr class="alternate author-self status-inherit" post-id="{{post_id}}">
	<td class="column-icon media-icon image-icon">
		<img width="39" height="60" src="{{attachment}}" class="attachment-80x60">
	</td>
	<td class="title column-title">
		<p style="margin-bottom: 0;"><a href="{{url}}" target="_blank">{{post_title}}</a></p>
	</td>
	<td class="author column-author open-image-details" style="text-align: center;cursor: pointer;"></td>
	<td class="date column-date" style="text-align: center;"></td>
	<td class="date column-date" style="text-align: center;"></td>
</tr>
